<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出片机</title>
<style>
  :root{--bg:#fdfbfc;--ink:#181617;--mute:#8f8d8e;--faint:#b6b4b5;--line:#ecEAEB}
  *{box-sizing:border-box;margin:0;padding:0}
  /* 左栏所有尺寸都用 rem：1rem = 视频里 720 高画面的 16px，按视口等比缩放 */
  html{font-size:clamp(11px,min(2.2222vh,1.4625vw),22px)}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Inter","Helvetica Neue",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* ───────── 左栏 ───────── */
  .copy{position:absolute;left:0;top:0;bottom:0;width:min(30rem,46vw);padding:1.85rem 1.8rem 1.85rem;
    display:flex;flex-direction:column;z-index:2}
  .who{display:flex;align-items:center;gap:.6rem;font-size:.8125rem;line-height:1.2}
  .who .ava{width:2.5rem;height:2.5rem;border-radius:50%;flex:none;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#5b5655,#1d1a19 70%);color:#f3efe9;font-size:1.05rem;letter-spacing:0}
  .who b{display:block;font-weight:500}
  .who em{display:block;font-style:normal;color:var(--mute)}
  h1{margin-top:3.55rem;font-size:2.5rem;line-height:1.05;font-weight:500;letter-spacing:-.035em}
  .lede{margin-top:.75rem;font-size:.9375rem;line-height:1.4rem;color:#2a2829}
  .cta{margin-top:1.75rem;display:flex;gap:.55rem;flex-wrap:wrap}
  .cta a{height:2.625rem;padding:0 2rem;border-radius:99px;display:inline-flex;align-items:center;
    font-size:.9375rem;transition:transform .25s cubic-bezier(.3,.7,.3,1),background .25s,color .25s,border-color .25s}
  .btn{background:#000;color:#fff}
  .btn:hover{transform:translateY(-2px);background:#222}
  .mail{border:1px solid var(--line);color:var(--mute)}
  .mail:hover{color:var(--ink);border-color:#d7d5d6}
  .clients{margin-top:auto;font-size:.8125rem;line-height:1.2rem}
  .clients p span{color:var(--mute)}
  .logos{display:flex;justify-content:space-between;align-items:center;width:26.6rem;max-width:100%;height:2.6rem;margin:1.05rem 0 1.15rem -.1rem}
  .lg{display:flex;align-items:center;gap:.3rem;color:#3c3a3b;white-space:nowrap;
    transition:opacity .38s ease,filter .38s ease;will-change:filter,opacity}
  .lg svg{width:1.2rem;height:1.2rem;flex:none}
  .lg.off{opacity:0;filter:blur(7px)}
  .clients small{display:block;font-size:.625rem;color:var(--mute);letter-spacing:.01em}

  /* ───────── 机器 ───────── */
  /* 机器按视频里的像素坐标搭（575×720 一帧），整体 scale 到视口 */
  #rig{position:absolute;left:0;top:0;width:575px;height:720px;transform-origin:0 0;z-index:1}
  #rig > svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #paper{position:absolute;left:194px;top:134px;width:256px;height:586px;overflow:hidden;
    background:#e9e8e5;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  #paper.grab{cursor:grabbing}
  #strip{position:absolute;left:0;top:0;width:256px;will-change:transform}
  .card{position:relative;width:256px;overflow:hidden;margin-bottom:3px;background:#fff}
  .card > .site{transform:scale(.2);transform-origin:0 0}
  /* 纸刚从辊子底下出来那一截：一道暗缝 + 一层发灰的雾 + 一点虚，像纸还在弯 */
  #paper .blur{position:absolute;left:0;right:0;top:0;height:96px;pointer-events:none;
    -webkit-backdrop-filter:blur(2.2px) saturate(.55);backdrop-filter:blur(2.2px) saturate(.55);
    -webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
  #paper .fog{position:absolute;left:0;right:0;top:0;height:112px;pointer-events:none;
    background:linear-gradient(180deg,rgba(30,27,24,.85) 0,rgba(110,105,100,.6) 3px,rgba(228,226,221,.97) 9px,
      rgba(222,220,216,.88) 30px,rgba(214,212,208,.6) 58px,rgba(210,208,204,.24) 86px,rgba(210,208,204,0) 112px)}
  #paper .edge{position:absolute;top:0;height:354px;width:9px;pointer-events:none;
    -webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
  #paper .edge.l{left:0;background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(0,0,0,0))}
  #paper .edge.r{right:0;background:linear-gradient(270deg,rgba(0,0,0,.32),rgba(0,0,0,0))}
  .ico{pointer-events:all;cursor:pointer}
  .ico .ink{transition:stroke .2s,fill .2s}
  .ico:hover .ink{stroke:#0e0e0d}
  .ico:hover .inkf{fill:#0e0e0d}

  /* ───────── 窄屏：上文下机 ───────── */
  body.narrow .copy{position:relative;width:auto;bottom:auto;padding:22px 20px 0}
  body.narrow h1{margin-top:1.6rem;font-size:1.95rem}
  body.narrow .lede br{display:none}
  body.narrow .cta{margin-top:1.1rem}
  body.narrow .clients{margin-top:1.3rem}
  body.narrow .logos{width:100%;margin:.6rem 0 0}
  body.narrow .clients small{display:none}
  body.narrow .clients p span{display:none}

  /* ════════ 纸上的网页（1280 宽排好，再缩到 0.2） ════════ */
  .site{position:relative;width:1280px;overflow:hidden;font-family:"Inter","Helvetica Neue",Arial,sans-serif;line-height:1.35}
  .site .nav{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
    padding:28px 56px;font-size:15px;z-index:3}
  .site .nav .ln{display:flex;gap:34px}
  .serif{font-family:Georgia,"Times New Roman",serif}

  /* 1 霓虹 */
  .s-neon{height:920px;background:#04050a;color:#fff}
  .s-neon .nav{color:#b9bccb}
  .s-neon .nav b{color:#fff;font-size:22px;letter-spacing:-.02em}
  .s-neon .nav .pl{border:1px solid #2c2f3d;border-radius:99px;padding:8px 18px;color:#fff;background:#0b0d16}
  .s-neon .limb{position:absolute;left:-700px;top:-1600px;width:1800px;height:1800px;border-radius:50%;background:#020309;
    box-shadow:0 0 0 2px rgba(170,205,255,.7),0 0 50px 14px rgba(70,130,255,.85),0 0 220px 70px rgba(40,90,255,.4)}
  .s-neon .rings{position:absolute;right:-60px;top:-40px}
  .s-neon .r0{fill:none;stroke:#2257ff;stroke-width:40;opacity:.8}
  .s-neon .r1{fill:none;stroke:#4f97ff;stroke-width:20}
  .s-neon .r2{fill:none;stroke:#cfe6ff;stroke-width:5}
  .s-neon .r3{fill:none;stroke:#3f86ff;stroke-width:7;opacity:.55}
  .s-neon h2{position:absolute;left:72px;top:330px;font-size:78px;line-height:.98;font-weight:400;letter-spacing:-.035em}
  .s-neon h2 em{font-style:normal;color:#86b2ff}
  .s-neon p{position:absolute;left:74px;top:520px;width:470px;font-size:18px;color:#8f95ab}
  .s-neon .dot{position:absolute;left:632px;top:585px;width:16px;height:16px;border-radius:50%;background:#5c9dff;box-shadow:0 0 18px #3f86ff}
  .s-neon .stats{position:absolute;left:56px;right:56px;top:650px;display:flex;justify-content:space-between;
    border-top:1px solid #1d2030;border-bottom:1px solid #1d2030;padding:20px 0}
  .s-neon .stats b{font-family:Georgia,serif;font-weight:400;font-size:40px}
  .s-neon .stats span{font-size:14px;color:#80869c;margin-left:12px}
  .s-neon .tiles{position:absolute;left:56px;right:56px;top:760px;height:170px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .s-neon .tiles div{background:#f2f2f5;border-radius:4px;position:relative;overflow:hidden}
  .s-neon .tiles .t1::before{content:"";position:absolute;left:150px;top:34px;width:220px;height:150px;border-radius:8px 8px 0 0;
    background:linear-gradient(135deg,#232633,#5d6478);box-shadow:60px 20px 0 -10px #c9ccd6}
  .s-neon .tiles .t2{background:#e7e7ec}

  /* 2 光球 */
  .s-orb{height:800px;background:radial-gradient(60% 70% at 50% 28%,#fff 0,#eeedf2 55%,#e1e0e6 100%);color:#1c1b22}
  .s-orb .nav{color:#55545e}
  .s-orb .nav b{color:#1c1b22;font-size:20px}
  .s-orb .nav .pl{background:#1c1b22;color:#fff;padding:9px 18px;border-radius:6px}
  .s-orb .orb{position:absolute;left:440px;top:30px;width:400px;height:400px;border-radius:50%;
    background:radial-gradient(circle at 46% 40%,#fff 0,#f4f1ff 32%,#ddd6f5 58%,rgba(210,200,245,0) 72%);
    box-shadow:0 0 160px 50px rgba(206,190,255,.55)}
  .s-orb .orb svg{position:absolute;left:0;top:0;opacity:.8;
    -webkit-mask-image:radial-gradient(circle,#000 42%,transparent 66%);mask-image:radial-gradient(circle,#000 42%,transparent 66%)}
  .s-orb h2{position:absolute;left:72px;top:470px;font-size:56px;line-height:1.02;font-weight:400;letter-spacing:-.03em;color:#4a4954}
  .s-orb h2 i{font-family:Georgia,serif;color:#16151b}
  .s-orb .bt{position:absolute;left:74px;top:680px;display:flex;gap:12px;font-size:15px}
  .s-orb .bt span{padding:11px 22px;border-radius:6px;background:#26252c;color:#fff}
  .s-orb .bt span+span{background:#fff;color:#26252c;border:1px solid #d6d5dc}
  .s-orb p{position:absolute;right:72px;top:560px;width:300px;font-size:15px;color:#6b6a74}

  /* 3 棱光 */
  .s-prism{height:900px;background:#060608;color:#fff}
  .s-prism .nav{color:#8c8c96}
  .s-prism .nav b{color:#fff;font-size:20px}
  .s-prism .fan{position:absolute;left:640px;top:760px;width:0;height:0}
  .s-prism .fan i{position:absolute;left:-75px;bottom:0;width:150px;height:820px;border-radius:75px;transform-origin:50% 100%;
    mix-blend-mode:screen;filter:blur(7px)}
  .s-prism h2{position:absolute;left:0;right:0;top:170px;text-align:center;font-size:72px;line-height:1.02;font-weight:400;letter-spacing:-.03em}
  .s-prism .sub{position:absolute;left:0;right:0;top:340px;text-align:center;font-size:18px;color:#a8a8b4}
  .s-prism .go{position:absolute;left:578px;top:410px;padding:12px 22px;background:#000;border:1px solid #333;border-radius:6px;font-size:15px}
  .s-prism .foot{position:absolute;left:0;right:0;top:600px;bottom:0;padding:50px 72px;
    background:linear-gradient(rgba(6,6,8,0),rgba(6,6,8,.82) 30%);display:flex;justify-content:space-between}
  .s-prism .foot .l b{font-size:24px;font-weight:500}
  .s-prism .foot .l p{margin-top:16px;width:430px;font-size:15px;color:#8b8b96}
  .s-prism .foot .c{display:flex;gap:70px;font-size:15px;color:#c2c2cc;line-height:2}
  .s-prism .copyr{position:absolute;left:72px;right:72px;bottom:26px;display:flex;justify-content:space-between;font-size:13px;color:#5d5d68}

  /* 4 复古 */
  .s-retro{height:900px;background:#f6eedb;color:#1a1a1a}
  .s-retro .pill{position:absolute;left:250px;top:26px;width:780px;height:56px;background:#fff;border:2px solid #1a1a1a;border-radius:12px;
    display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 22px;font-size:15px}
  .s-retro .pill b{font-family:Georgia,serif;font-style:italic;color:#d4462f;font-size:24px}
  .s-retro .pill span{display:flex;gap:28px}
  .s-retro .pill em{font-style:normal;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px}
  .s-retro .mac{position:absolute;left:470px;top:150px;width:340px;height:330px;border-radius:20px 20px 10px 10px;
    background:linear-gradient(160deg,#efe7d2,#d8cdb2);box-shadow:inset -10px -14px 24px rgba(120,100,60,.22),inset 6px 6px 12px rgba(255,255,255,.6),0 18px 30px rgba(80,60,20,.15)}
  .s-retro .scr{position:absolute;left:34px;top:30px;width:272px;height:210px;border-radius:14px;background:#d2c7aa;padding:16px;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.18)}
  .s-retro .scr div{width:100%;height:100%;border-radius:10px;background:#fbfaf5;border:8px solid #2a2a28;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;font-size:12px;text-align:center;line-height:1.25}
  .s-retro .slot{position:absolute;right:40px;bottom:36px;width:110px;height:9px;border-radius:4px;background:#3a352b}
  .s-retro .base{position:absolute;left:510px;top:478px;width:260px;height:40px;border-radius:0 0 12px 12px;background:linear-gradient(#d5c9ac,#c2b593)}
  .s-retro .cup{position:absolute;left:110px;top:200px}
  .s-retro .face{position:absolute;right:110px;top:150px}
  .s-retro h2{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:64px;font-weight:400;letter-spacing:-.025em}
  .s-retro .sub{position:absolute;left:0;right:0;top:690px;text-align:center;font-size:18px;color:#6d6656}
  .s-retro .bt{position:absolute;left:0;right:0;top:750px;display:flex;justify-content:center;gap:12px;font-size:15px}
  .s-retro .bt span{padding:12px 22px;border-radius:10px;border:2px solid #1a1a1a;background:#fff}
  .s-retro .bt span:first-child{background:#1a1a1a;color:#fff}

  /* 5 拼贴 */
  .s-col{height:860px;background:#0d0d0d;color:#fff}
  .s-col .nav{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#a9a9a9}
  .s-col h2{position:absolute;left:64px;top:150px;font-size:96px;line-height:.9;font-weight:800;letter-spacing:-.01em;
    transform:scaleX(.78);transform-origin:0 0;white-space:nowrap}
  .s-col .chips{position:absolute;left:64px;top:470px;display:flex;gap:14px;font-size:14px;align-items:center;color:#9a9a9a}
  .s-col .chips b{background:#fff;color:#0d0d0d;padding:9px 18px;border-radius:99px;font-weight:500}
  .s-col .folder{position:absolute;left:720px;top:120px;width:430px;height:310px;border-radius:6px;
    background:linear-gradient(170deg,#c99d69,#a77a49);transform:rotate(-3deg);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .s-col .folder::before{content:"";position:absolute;left:24px;top:-26px;width:150px;height:34px;border-radius:6px 6px 0 0;background:#c49764}
  .s-col .sheet{position:absolute;left:560px;top:180px;width:330px;height:270px;background:#f3f1ea;transform:rotate(4deg);
    padding:26px;color:#1b1b1b;box-shadow:0 10px 24px rgba(0,0,0,.45);
    background-image:repeating-linear-gradient(transparent 0 25px,#dad6cb 25px 26px)}
  .s-col .sheet b{display:block;font-size:22px;letter-spacing:.04em;line-height:1.1}
  .s-col .sheet small{display:block;margin-top:10px;font-size:13px;color:#777}
  .s-col .pola{position:absolute;left:850px;top:390px;width:300px;height:340px;background:#f7f6f1;padding:16px 16px 70px;
    transform:rotate(-5deg);box-shadow:0 14px 30px rgba(0,0,0,.5)}
  .s-col .pola div{position:relative;width:100%;height:100%;background:linear-gradient(165deg,#47697c,#a98965 70%,#c99c6c);overflow:hidden}
  .s-col .pola div::before{content:"";position:absolute;left:84px;top:52px;width:96px;height:110px;border-radius:50%;background:#1d1a18}
  .s-col .pola div::after{content:"";position:absolute;left:30px;top:150px;width:210px;height:200px;border-radius:100px 100px 0 0;background:#1d1a18}
  .s-col .sticky{position:absolute;left:600px;top:480px;width:180px;height:170px;background:#f5e07a;transform:rotate(7deg);padding:20px;
    color:#2a2410;font:italic 22px/1.25 "Segoe Print","Bradley Hand","Comic Sans MS",cursive;box-shadow:0 8px 18px rgba(0,0,0,.4)}
  .s-col .ticket{position:absolute;left:520px;top:690px;width:270px;height:96px;background:#ece2c8;transform:rotate(-2deg);
    border:2px dashed #b9aa82;color:#3b3322;padding:16px 20px;font:700 15px/1.3 "JetBrains Mono",Menlo,monospace;letter-spacing:.12em}
  .s-col .scrib{position:absolute;left:0;top:0}

  /* 6 丝绸 */
  .s-silk{height:760px;background:linear-gradient(180deg,#b9bbc2 0,#dfe0e5 52%,#f2f2f4 100%);color:#17171b}
  .s-silk .nav{color:#3d3d45}
  .s-silk .nav b{color:#17171b;font-size:20px}
  .s-silk .nav .pl{border:1px solid #9a9ba3;border-radius:99px;padding:8px 18px}
  .s-silk .waves{position:absolute;left:0;top:0}
  .s-silk h2{position:absolute;left:72px;top:440px;font-size:62px;line-height:1.02;font-weight:500;letter-spacing:-.035em}
  .s-silk p{position:absolute;left:74px;top:580px;width:420px;font-size:16px;color:#55555f}
  .s-silk .bt{position:absolute;left:74px;top:660px;display:flex;gap:12px;font-size:15px}
  .s-silk .bt span{padding:11px 22px;border-radius:99px;background:#17171b;color:#fff}
  .s-silk .bt span+span{background:rgba(255,255,255,.6);color:#17171b}

  /* 7 网格 */
  .s-grid{height:560px;background:#fafaf8;color:#111}
  .s-grid .nav{color:#555}
  .s-grid .nav b{color:#111;font-size:20px}
  .s-grid h2{position:absolute;left:52px;top:84px;font-size:190px;line-height:1;font-weight:800;letter-spacing:-.06em}
  .s-grid h2 sup{font-size:40px;font-weight:500;letter-spacing:0;vertical-align:top;position:relative;top:24px;margin-left:10px}
  .s-grid p{position:absolute;right:56px;top:150px;width:330px;font-size:16px;color:#555}
  .s-grid .tl{position:absolute;left:56px;right:56px;top:320px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .s-grid .tl div{height:180px;border-radius:4px;position:relative;overflow:hidden;font-weight:700}
  .s-grid .tl small{position:absolute;left:16px;bottom:14px;font-size:13px;font-weight:500}
</style>
</head>
<body>

<!-- 纸上网页共用的滤镜（多份拷贝都引用这一份） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="fxNeon" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="fxBrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.032" numOctaves="4" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .40  0 0 0 0 .50  -3.4 0 0 0 1.05"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
</svg>

<main class="copy" id="copy">
  <header class="who">
    <span class="ava">屿</span>
    <span><b>周屿 Zhou Yu</b><em>网页设计 + 开发</em></span>
  </header>
  <h1>做能赢得信任、<br>带来增长的网站</h1>
  <p class="lede">帮早期团队把产品讲清楚：第一屏让人看懂，<br>第二屏让人行动。从设计、开发到上线，<br>一个人从头做到尾。</p>
  <div class="cta">
    <a class="btn" href="#">预约 20 分钟沟通</a>
    <a class="mail" href="mailto:hello@example.com">hello@example.com</a>
  </div>
  <section class="clients">
    <p>合作过 30+ 团队与工作室<br><span>（含直接合作，以及通过创意伙伴的合作）</span></p>
    <div class="logos" id="logos"></div>
    <small>© 2026 出片机 · 动效复刻练习，人物与品牌均为虚构</small>
  </section>
</main>

<div id="rig">
  <!-- 后层：线缆（被侧板、电机挡住两端） -->
  <svg width="575" height="720" viewBox="0 0 575 720" aria-hidden="true">
    <g fill="none" stroke-linecap="round">
      <!-- 左上那根粗黑线 -->
      <path d="M8 -30 C4 70 34 150 96 190 S150 222 160 232" stroke="#151515" stroke-width="11"/>
      <path d="M6 -30 C2 70 32 148 94 187 S148 219 158 229" stroke="#6d6d6a" stroke-width="2.2" opacity=".55" transform="translate(-2.2,-1.6)"/>
      <!-- 电机底下红黑两根 -->
      <path d="M124 360 C120 410 128 444 162 455" stroke="#a3221b" stroke-width="5"/>

   出片机 —— 一台把作品集网页一张张「印」出来的小机器。

   左下角合作方 logo 每 4 秒一组，从左到右依次虚化消失、再依次显影。
   ════════════════════════════════════════════════════════════ */

const BASE_SPEED = 19;        // 设计坐标 px/s（720 高画面）

const LOGO_PERIOD = 4000;

const rig = $('#rig'), paper = $('#paper'), strip = $('#strip'), copyEl = $('#copy');

/* ───────── 一点工具 ───────── */
const f1 = n => Math.round(n * 10) / 10;
function rtri(cx, cy, R, rot, k) {           // 圆角三角形（霓虹管的形状）
  const P = [0, 1, 2].map(i => { const a = rot + i * 2 * Math.PI / 3; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  let d = '';
  for (let i = 0; i < 3; i++) {
    const p = P[i], a = P[(i + 2) % 3], b = P[(i + 1) % 3];
    const p1 = [p[0] + (a[0] - p[0]) * k, p[1] + (a[1] - p[1]) * k];
    const p2 = [p[0] + (b[0] - p[0]) * k, p[1] + (b[1] - p[1]) * k];
    d += (i ? 'L' : 'M') + f1(p1[0]) + ' ' + f1(p1[1]) + 'Q' + f1(p[0]) + ' ' + f1(p[1]) + ' ' + f1(p2[0]) + ' ' + f1(p2[1]);
  }
  return d + 'Z';
}
function silk() {                             // 丝绸那张：一组相位错开的正弦线
  let s = '';
  for (let i = 0; i < 52; i++) {
    const t = i / 51, y0 = 70 + i * 6.2, amp = 70 + 90 * Math.sin(t * Math.PI);
    let d = '';
    for (let x = -40; x <= 1320; x += 20) {
      const y = y0 + amp * Math.sin(x / 300 + t * 1.6) * 0.55 + 46 * Math.sin(x / 140 - t * 2.4) * (0.3 + t * 0.7);
      d += (x === -40 ? 'M' : 'L') + x + ' ' + f1(y);
    }
    const lit = Math.pow(Math.sin(t * Math.PI), 1.6);
    s += `<path d="${d}" fill="none" stroke="${i % 7 === 3 ? 'rgba(40,42,52,.28)' : 'rgba(255,255,255,' + (0.18 + lit * 0.72).toFixed(2) + ')'}" stroke-width="${(1 + lit * 1.8).toFixed(2)}"/>`;
  }
  return s;
}

  sq: '<svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="2" fill="currentColor"/><path d="M6 13l4-6 4 6" fill="none" stroke="#fdfbfc" stroke-width="1.8"/></svg>',

  tri: '<svg viewBox="0 0 20 20"><path d="M10 3l8 14H2z" fill="currentColor"/></svg>',

const LOGOS = [
  [`${G.half}<b style="font-size:1.05rem;font-weight:700;letter-spacing:-.02em">Halden</b>`,
   `${G.wave}<b style="font-size:.72rem;font-weight:600;letter-spacing:.16em">NORTHWAVE</b>`,

];

/* ───────── 纸带：一套七张，叠几份，取模循环 ───────── */
let setH = 0, copies = 0, paperH = 586, scale = 1;
const SET_HTML = CARDS.map(c => `<div class="card" style="height:${c.h * 0.2}px">${c.html}</div>`).join('');
CARDS.forEach(c => setH += c.h * 0.2 + 3);

function ensureCopies() {
  const need = 1 + Math.ceil(paperH / setH);
  while (copies < need) { strip.insertAdjacentHTML('beforeend', SET_HTML); copies++; }
}

/* ───────── 布局：机器按视频坐标搭好，整体缩放 ───────── */
function layout() {
  const W = innerWidth, H = innerHeight, narrow = W < 720;
  document.body.classList.toggle('narrow', narrow);
  let x, y;
  if (!narrow) {
    scale = Math.min(H / 720, W * 0.56 / 575);
    const rw = 575 * scale;
    x = W / 2 + Math.max(0, (W / 2 - rw) / 2);
    x = Math.min(x, W - rw);
    y = 0;
  } else {
    const top = copyEl.getBoundingClientRect().bottom;
    scale = Math.min(W * 1.02 / 575, Math.max(0.42, (H - top) / 600));
    x = W / 2 - 322 * scale;
    y = top + 52 * scale;
  }
  rig.style.transform = `translate(${x}px,${y}px) scale(${scale})`;
  paperH = Math.max(586, Math.ceil((H - y) / scale - 134) + 2);
  paper.style.height = paperH + 'px';
  ensureCopies();
}
addEventListener('resize', layout);

/* ───────── 机器上的小零件 ───────── */
(function parts() {
  const NS = 'http://www.w3.org/2000/svg';
  const pins = $('#pins'), hdr = $('#hdr'), knurl = $('#knurl');
  for (let x = 305; x < 452; x += 10.4) {
    const r = document.createElementNS(NS, 'rect');
    Object.entries({ x: x.toFixed(1), y: 32, width: 4.6, height: 6, fill: '#b8b8b3' }).forEach(([k, v]) => r.setAttribute(k, v));
    pins.appendChild(r);
  }
  for (const [a, b] of [[296, 452], [236, 282]]) for (let x = a; x < b; x += 9.2) {
    const r = document.createElementNS(NS, 'rect');
    Object.entries({ x: x.toFixed(1), y: 66.5, width: 5, height: 5, fill: '#3a3a38' }).forEach(([k, v]) => r.setAttribute(k, v));
    hdr.appendChild(r);
  }
  // 滑轮表面的横纹：一圈 16 条，随走纸转动（投影到正面后越靠上下边越密，像圆柱）
  for (let i = 0; i < 16; i++) {
    const l = document.createElementNS(NS, 'path');
    l.setAttribute('stroke', i % 2 ? '#2a2a28' : '#e8e9e4');
    l.setAttribute('opacity', i % 2 ? '.35' : '.3');
    knurl.appendChild(l);
  }
})();
const knurlLines = [...document.querySelectorAll('#knurl path')];
function drawKnurl(phase) {
  // 圆柱侧面：角度均匀 → 投影后 y = cy + r·sin(θ)
  const cy = 113, r = 40;
  knurlLines.forEach((l, i) => {
    let th = ((i / knurlLines.length) * Math.PI * 2 + phase) % (Math.PI * 2);
    if (th > Math.PI) { l.setAttribute('d', ''); return; }     // 背面的不画
    const y = cy - r * Math.cos(th);
    l.setAttribute('d', `M119 ${y.toFixed(2)}H159`);
  });
}

/* ───────── 走纸 ───────── */
let off = setH * 0.35, v = REDUCE ? 0 : BASE_SPEED, hover = false, drag = null, last = performance.now();
const mod = (a, n) => ((a % n) + n) % n;
const led = $('#led'), ledG = $('#ledGlowDot');

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!drag) {
    const base = REDUCE ? 0 : (hover ? HOVER_SPEED : BASE_SPEED);
    v += (base - v) * (1 - Math.exp(-dt * 2.4));
    off += v * dt;
  }
  strip.style.transform = `translate3d(0,${(mod(off, setH) - setH).toFixed(2)}px,0)`;
  drawKnurl(off / 40);                                   // 辊子周长 ≈ 2π·40，纸走多少它转多少
  const k = Math.min(1, Math.abs(v) / 260);
  led.setAttribute('opacity', (0.45 + k * 0.55).toFixed(2));
  ledG.setAttribute('opacity', (0.25 + k * 0.75).toFixed(2));
  requestAnimationFrame(frame);
}

addEventListener('wheel', e => {
  const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
  v = Math.max(-2400, Math.min(2400, v + d * 2.6));
}, { passive: true });

paper.addEventListener('pointerenter', () => hover = true);
paper.addEventListener('pointerleave', () => hover = false);
paper.addEventListener('pointerdown', e => {
  paper.setPointerCapture(e.pointerId);
  paper.classList.add('grab');
  drag = { y: e.clientY, t: performance.now(), v: 0 };
});
paper.addEventListener('pointermove', e => {
  if (!drag) return;
  const now = performance.now(), dy = (e.clientY - drag.y) / scale, dt = Math.max(1, now - drag.t) / 1000;
  off += dy;
  drag.v = drag.v * 0.6 + (dy / dt) * 0.4;
  drag.y = e.clientY; drag.t = now;
});
const endDrag = () => { if (!drag) return; v = Math.max(-2400, Math.min(2400, drag.v)); drag = null; paper.classList.remove('grab'); };
paper.addEventListener('pointerup', endDrag);
paper.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === ' ') { v += 420; e.preventDefault(); }
  if (e.key === 'ArrowUp') { v -= 420; e.preventDefault(); }
});

/* ───────── logo 轮换：依次虚掉 → 空一拍 → 依次显出 ───────── */
const logosEl = $('#logos');
let gi = 0;
function renderLogos(i, hidden) {
  logosEl.innerHTML = LOGOS[i].map(h => `<span class="lg${hidden ? ' off' : ''}">${h}</span>`).join('');
}
function swapLogos() {
  const STAG = 75, DUR = 380, GAP = 220;
  const items = [...logosEl.children];
  items.forEach((el, j) => { el.style.transitionDelay = (j * STAG) + 'ms'; el.classList.add('off'); });
  setTimeout(() => {
    gi = (gi + 1) % LOGOS.length;
    renderLogos(gi, true);
    const next = [...logosEl.children];
    void logosEl.offsetWidth;                          // 先让「虚着」的状态落地，再过渡出来
    next.forEach((el, j) => { el.style.transitionDelay = (j * STAG) + 'ms'; el.classList.remove('off'); });
  }, DUR + STAG * 3 + GAP);
}
renderLogos(0, false);
if (!REDUCE) setInterval(swapLogos, LOGO_PERIOD);
else setInterval(() => { gi = (gi + 1) % LOGOS.length; renderLogos(gi, false); }, LOGO_PERIOD * 2);

layout();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
