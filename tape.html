<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>滚滚胶带</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#f3f3f1;color:#111;overflow:hidden;
    font:12px/1.4 "SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
  #cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #cv.drag{cursor:grabbing}

  .hud{position:fixed;pointer-events:none;letter-spacing:.09em;text-transform:uppercase;font-size:10px}
  .tl{top:18px;left:18px}
  .tc{top:18px;left:50%;transform:translateX(-50%);text-align:center;line-height:1.7}
  .tr{top:18px;right:18px;text-align:right;line-height:1.9}
  .tr b{display:inline-block;min-width:56px;text-align:left;font-weight:400;color:#aaa}
  .lv{left:16px;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;
      color:#bbb;letter-spacing:.22em}

  .mark{display:flex;align-items:center;gap:8px}
  .mark i{width:22px;height:22px;background:#111;color:#fff;display:grid;place-items:center;
    font-style:normal;font-size:9px;font-weight:700;letter-spacing:0}
  .mark em{font-style:normal;display:block;font-size:13px;letter-spacing:.02em;
    font-family:-apple-system,"PingFang SC",system-ui,sans-serif;font-weight:600}

  .big{position:fixed;bottom:16px;font:800 clamp(34px,7vw,86px)/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:-.03em;color:#111;pointer-events:none}
  .big.l{left:16px} .big.r{right:16px}

  .bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:min(52vw,560px);pointer-events:none}
  .bar .track{height:12px;background:#111;position:relative;overflow:hidden}
  .bar .fill{position:absolute;inset:0 auto 0 0;background:#e8442e;width:0%}
  .bar .lab{display:flex;justify-content:space-between;font-size:9px;margin-top:5px;letter-spacing:.14em}
  .now{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);font-size:10px;
    letter-spacing:.18em;pointer-events:none}

  .card{position:fixed;right:22px;bottom:96px;width:172px;background:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.14);pointer-events:none}
  .card .tt{display:flex;gap:4px;padding:7px 8px;border-bottom:1px solid #eee}
  .card .tt i{width:7px;height:7px;border-radius:50%;background:#ddd}
  .card .bd{padding:10px;display:flex;gap:10px;align-items:center}
  .card .bd .t{font-size:10px;line-height:1.35;font-weight:700;letter-spacing:.04em}
  .card .bd .t small{display:block;font-weight:400;color:#aaa;margin-top:3px;letter-spacing:.1em}
  .card .sw{width:52px;height:52px;border-radius:50%;flex:none;background:#ff3ea5}
  .card .cap{position:absolute;top:-16px;left:0;font-size:9px;letter-spacing:.16em}

  @media (max-width:700px){ .card,.tr{display:none} .big{font-size:38px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud tl mark"><i>RT</i><span><em>滚滚胶带</em>Rolling Tape / Portfolio</span></div>
<div class="hud tc">Creative Direction × Digital Experiences<br>Built to move.</div>
<div class="hud tr">
  <div><b>MOVE</b> DRAG / WHEEL</div>
  <div><b>FPS</b> <span id="fps">–</span></div>
  <div><b>TAPE</b> <span id="len">0.00</span> M</div>
  <div><b>REWIND</b> [SPACE]</div>
</div>
<div class="hud lv">Rolling / Keep dragging</div>

<div class="big l">DESIGN</div>
<div class="big r">CODE</div>
<div class="now" id="now">#01 &nbsp; SOFT MACHINE</div>
<div class="bar"><div class="track"><div class="fill" id="fill"></div></div>
  <div class="lab"><span>View works</span><span id="cnt">000</span></div></div>

<div class="card">
  <div class="cap">View my sandbox</div>
  <div class="tt"><i></i><i></i><i></i></div>
  <div class="bd"><div class="t" id="cardT">SOFT<br>MACHINE<small>OBJECT / 2026</small></div>
    <div class="sw" id="cardSw"></div></div>
</div>

<script>
/* =====================================================================
 * 滚滚胶带
 *
 * 最关键的一点：这是一张二维插画，不是三维场景。
 * 带子就是一条 2D 路径描出来的形状；贴纸是「平的方块」，只跟着切线转个
 * 角度，不做任何透视变形。整张图里只有卷轴画出立体感。
 *
 * 卷轴钉死在桌面上不动；拖动滚的是带子上的内容——胶带从卷轴里抽出来。
 * ===================================================================== */

/* ---------- 种子随机：第 n 张贴纸永远长一个样，往回拖能拖回原来那张 ---------- */
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
class Rng{
  constructor(s){this.f=mulberry32((s*2654435761)>>>0);}
  n(){return this.f();} r(a,b){return a+(b-a)*this.n();}
  i(a,b){return Math.floor(this.r(a,b+1));} pick(a){return a[Math.floor(this.n()*a.length)];}
  c(p){return this.n()<p;}
}

const INK='#141414', PAPER='#fbfaf7';
const HUES=['#e8442e','#f5c518','#2fbd6b','#2b6cf6','#ff3ea5','#141414','#7c4dff','#00c2c7'];
const WORDS=['SOFT MACHINE','PAPER DRIFT','LOOP STUDY','NIGHT INDEX','HALF TONE','KEEP ROLLING',
             'FIELD NOTES','SLOW MOTION','AFTER IMAGE','RE-RUN','GRAIN','OFFSET'];

/* ---------- 虚拟画布：坐标都在这个尺寸里定义，最后整体缩放贴合窗口 ---------- */
const VW=1600, VH=900;
const TAPE_W=112;                             // 带宽
const STEP=124;                               // 贴纸间隔（弧长）
const ROLL_X=1270, ROLL_Y=436, ROLL_R=124;

/* ---------- 路径：平面上的一条蛇形，从卷轴往左铺开 ---------- */
function pt(t){
  const x = ROLL_X - t*1580;
  const y = ROLL_Y + 126*Math.sin(t*10.6 + 0.30) + 70*Math.sin(t*4.3 + 1.9);
  return [x, y];
}
function widthAt(u){ return TAPE_W * (1 - 0.15*Math.min(1,Math.max(0,u))); }

/* 采样 + 弧长表，贴纸才能等距摆放 */
const N=260, TMAX=1.06;
const P=[], TAN=[], ARC=[0];
for (let i=0;i<=N;i++) P.push(pt(i/N*TMAX));
for (let i=0;i<=N;i++){
  const a=P[Math.max(0,i-1)], b=P[Math.min(N,i+1)];
  const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1;
  TAN.push([dx/l,dy/l]);
  if(i>0) ARC.push(ARC[i-1]+Math.hypot(P[i][0]-P[i-1][0], P[i][1]-P[i-1][1]));
}
const TOTAL=ARC[N];

function atArc(s){
  if(s<=0) return {p:P[0],tan:TAN[0],i:0};
  if(s>=TOTAL) return {p:P[N],tan:TAN[N],i:N};
  let lo=0,hi=N;
  while(hi-lo>1){ const m=(lo+hi)>>1; ARC[m]<s?lo=m:hi=m; }
  const f=(s-ARC[lo])/((ARC[hi]-ARC[lo])||1);
  return { p:[P[lo][0]+(P[hi][0]-P[lo][0])*f, P[lo][1]+(P[hi][1]-P[lo][1])*f],
           tan:TAN[lo], i:lo };
}

/* ---------- 贴纸：平的方块，零透视变形 ---------- */
function sticker(g, idx, size){
  const r=new Rng(idx), hue=r.pick(HUES), kind=r.i(0,5), s=size;
  g.fillStyle=hue; g.fillRect(-s/2,-s/2,s,s);
  // 必须裁到方块内：斜纹那一档会画到框外，拉出长黑条
  g.save(); g.beginPath(); g.rect(-s/2,-s/2,s,s); g.clip(); g.translate(-s/2,-s/2);
  if(kind===0){
    g.fillStyle=INK; g.beginPath(); g.arc(s/2,s/2,s*r.r(.26,.33),0,7); g.fill();
    g.fillStyle=PAPER; g.beginPath(); g.arc(s/2,s/2,s*.075,0,7); g.fill();
  } else if(kind===1){
    g.fillStyle=r.pick(HUES); g.beginPath();
    g.moveTo(0,s); g.lineTo(s,0); g.lineTo(s,s); g.closePath(); g.fill();
  } else if(kind===2){
    g.fillStyle=r.pick(HUES); const m=r.i(3,6);
    for(let i=0;i<m;i++) g.fillRect(s*(.12+i*.76/m), s*.18, s*.76/m*.52, s*.64);
  } else if(kind===3){
    for(let i=5;i>0;i--){ g.fillStyle=i%2?'rgba(255,255,255,.6)':hue;
      g.beginPath(); g.arc(s/2,s/2,s*.44*i/5,0,7); g.fill(); }
  } else if(kind===4){
    g.fillStyle=INK; g.fillRect(0,s*.30,s,s*.40);
    g.fillStyle=PAPER; g.font=`700 ${s*.21}px ui-monospace,monospace`;
    g.fillText(String(idx%100).padStart(2,'0'), s*.08, s*.585);
  } else {
    g.strokeStyle=INK; g.lineWidth=s*.07;
    for(let i=-s;i<s*2;i+=s*.21){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+s,s); g.stroke(); }
  }
  g.restore();
  g.strokeStyle='rgba(0,0,0,.32)'; g.lineWidth=1.2; g.strokeRect(-s/2,-s/2,s,s);
}

/* ---------- 画布 ---------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,K=1,OX=0,OY=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  K=Math.min(W/VW,H/VH)*0.99;      // 装下整幅设计，不裁切
  OX=(W-VW*K)/2; OY=(H-VH*K)/2;
}
addEventListener('resize',resize); resize();
const toScene=()=>ctx.setTransform(DPR*K,0,0,DPR*K,DPR*OX,DPR*OY);
const toPix  =()=>ctx.setTransform(DPR,0,0,DPR,0,0);

/* ---------- 状态与交互 ---------- */
const view={s:0,vel:0};
let dragging=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{dragging=true;cv.classList.add('drag');
  lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',()=>{dragging=false;cv.classList.remove('drag');});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  view.vel -= (dx-dy)*0.85/K;     // 往左拖 = 把带子从卷轴里抽出来
});
addEventListener('wheel',e=>{ view.vel += e.deltaY*0.5/K; },{passive:true});
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault(); view.vel=-28;} });

/* ---------- 带子的形状 ---------- */
function ribbonChunk(a,b){
  ctx.beginPath();
  for(let i=a;i<=b;i++){
    const w=widthAt(i/N)/2, t=TAN[i];
    const x=P[i][0]-t[1]*w, y=P[i][1]+t[0]*w;
    i===a?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  for(let i=b;i>=a;i--){
    const w=widthAt(i/N)/2, t=TAN[i];
    ctx.lineTo(P[i][0]+t[1]*w, P[i][1]-t[0]*w);
  }
  ctx.closePath();
}
function ribbonEdges(a,b){
  for(const side of [-1,1]){
    ctx.beginPath();
    for(let i=a;i<=b;i++){
      const w=widthAt(i/N)/2*side, t=TAN[i];
      const x=P[i][0]-t[1]*w, y=P[i][1]+t[0]*w;
      i===a?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}

/* ---------- 卷轴：整张图里唯一有立体感的东西 ---------- */
function roll(){
  const thx=58, thy=-32, rx=ROLL_R, ry=ROLL_R*0.78, rot=-0.15;
  for(let i=34;i>=0;i--){                 // 圆柱侧面：一叠椭圆，带明暗
    const f=i/34, g=196-46*f;
    ctx.save(); ctx.translate(ROLL_X+thx*f, ROLL_Y+thy*f); ctx.rotate(rot);
    ctx.fillStyle=`rgb(${g},${g},${g-5})`;
    ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,7); ctx.fill();
    ctx.restore();
  }
  ctx.save(); ctx.translate(ROLL_X+thx,ROLL_Y+thy); ctx.rotate(rot);
  const head=Math.floor(view.s/STEP);
  for(let k=0;k<16;k++){                  // 缠在外缘的胶带，随抽出量转
    const a0=-view.s/ROLL_R + k/16*Math.PI*2;
    const r2=new Rng(head+k+7);
    ctx.save(); ctx.rotate(a0);
    ctx.fillStyle=r2.c(.5)?r2.pick(HUES):PAPER;
    ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,-0.185,0.185);
    ctx.ellipse(0,0,rx*.93,ry*.93,0,0.185,-0.185,true); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='#edebe6'; ctx.beginPath(); ctx.ellipse(0,0,rx*.925,ry*.925,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.30)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,7); ctx.stroke();
  ctx.fillStyle='#d9d7d1'; ctx.beginPath(); ctx.ellipse(0,0,rx*.50,ry*.50,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.16)';
  ctx.beginPath(); ctx.ellipse(0,0,rx*.50,ry*.50,0,0,7); ctx.stroke();
  ctx.fillStyle='#fbfaf7'; ctx.beginPath(); ctx.ellipse(0,0,rx*.29,ry*.29,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.24)';
  ctx.beginPath(); ctx.ellipse(0,0,rx*.29,ry*.29,0,0,7); ctx.stroke();
  ctx.restore();
}

/* ---------- 绘制 ---------- */
const CH=13;                               // 分段：后画的压住先画的，交叉处的上下关系就出来了
function draw(){
  toPix();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fbfbf9'); g.addColorStop(1,'#eaeae6');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  toScene();

  const SX=30, SY=36;                      // 影子：图形化的实影，不是柔影
  ctx.save(); ctx.translate(SX,SY);
  ctx.fillStyle='rgba(30,30,36,.16)';
  for(let c=0;c<CH;c++) { ribbonChunk(Math.floor(c*N/CH), Math.floor((c+1)*N/CH)); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(ROLL_X+16,ROLL_Y+6,ROLL_R*1.04,ROLL_R*0.84,-0.15,0,7); ctx.fill();
  ctx.restore();

  for(let c=0;c<CH;c++){
    const a=Math.floor(c*N/CH), b=Math.floor((c+1)*N/CH);
    ctx.fillStyle=PAPER; ribbonChunk(a,b); ctx.fill();

    const sa=ARC[a], sb=ARC[b];
    for(let k=Math.floor((sa+view.s)/STEP); k<=Math.ceil((sb+view.s)/STEP); k++){
      const s=k*STEP-view.s;
      if(s<sa||s>=sb) continue;
      const q=atArc(s), r=new Rng(k);
      if(r.c(.13)) continue;               // 留白
      const w=widthAt(q.i/N), ang=Math.atan2(q.tan[1],q.tan[0]);
      ctx.save(); ctx.translate(q.p[0],q.p[1]); ctx.rotate(ang+r.r(-.12,.12));
      sticker(ctx,k,w*r.r(.60,.76));
      ctx.restore();
      ctx.save(); ctx.translate(q.p[0],q.p[1]); ctx.rotate(ang);
      ctx.fillStyle='rgba(20,20,20,.6)';
      ctx.font=`${w*.115}px ui-monospace,monospace`;
      ctx.fillText(WORDS[((k%WORDS.length)+WORDS.length)%WORDS.length], -w*.44, -w*.40);
      ctx.fillText('N°'+String(((k%1000)+1000)%1000).padStart(3,'0'), -w*.44, w*.47);
      ctx.restore();
    }
    ctx.strokeStyle='rgba(20,20,20,.6)'; ctx.lineWidth=1.6; ribbonEdges(a,b);
  }
  roll();
}

/* ---------- 主循环 ---------- */
let frames=0, fpsT=performance.now();
function tick(now){
  view.vel*=0.93;
  if(!dragging && Math.abs(view.vel)<0.12) view.vel=1.15;   // 静止时自己慢慢抽
  view.s+=view.vel;
  if(view.s<0){ view.s=0; view.vel=0; }
  draw();

  frames++;
  if(now-fpsT>500){ document.getElementById('fps').textContent=Math.round(frames*1000/(now-fpsT));
    frames=0; fpsT=now; }
  const k=Math.floor(view.s/STEP);
  document.getElementById('cnt').textContent=String(k).padStart(3,'0');
  document.getElementById('len').textContent=(view.s/STEP*0.08).toFixed(2);
  document.getElementById('fill').style.width=((view.s/STEP)%12)/12*100+'%';
  const w=WORDS[k%WORDS.length];
  document.getElementById('now').textContent='#'+String(k%100).padStart(2,'0')+'  '+w;
  document.getElementById('cardT').innerHTML=w.replace(' ','<br>')+'<small>OBJECT / 2026</small>';
  document.getElementById('cardSw').style.background=HUES[k%HUES.length];
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
