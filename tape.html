<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#f2f2f0;color:#111;overflow:hidden;

  .tl{top:18px;left:18px}
  .tc{top:18px;left:50%;transform:translateX(-50%);text-align:center;line-height:1.7;color:#111}
  .tr{top:18px;right:18px;text-align:right;line-height:1.9}

<body>
<canvas id="cv"></canvas>

<div class="hud tl mark"><i>RT</i><span><em>滚滚胶带</em>Rolling Tape / Portfolio</span></div>
<div class="hud tc">Creative Direction × Digital Experiences<br>Built to move.</div>
<div class="hud tr">
  <div><b>MOVE</b> DRAG / WHEEL</div>

</div>

<div class="big r">CODE</div>

<div class="bar"><div class="track"><div class="fill" id="fill"></div></div>
  <div class="lab"><span>View works</span><span id="cnt">000</span></div></div>

<div class="card">
  <div class="cap">View my sandbox</div>
  <div class="tt"><i></i><i></i><i></i></div>
  <div class="bd"><div class="t" id="cardT">SOFT<br>MACHINE<small>OBJECT / 2026</small></div>
    <div class="sw" id="cardSw"></div></div>
</div>

<script>
/* =====================================================================
 * 滚滚胶带 —— 一条会自己长出新图案的胶带
 *
 * 不用任何 3D 库：自己做透视投影 + 逐段仿射贴图。
 * 核心三件事：
 *   1) 路径 path(s)：一条在空间里蜿蜒的曲线，s 是沿带长度
 *   2) 环形贴图：16 个格子循环复用，滚过去一格就重画一格 → 图案无限新
 *   3) 画家算法：段按深度排序，远的先画，胶带才能正确地互相遮挡
 * ===================================================================== */

/* ---------- 种子随机（同一格子每次重画都换种子，所以图案一直是新的）---------- */
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
class Rng{
  constructor(s){this.f=mulberry32(s>>>0);}
  n(){return this.f();} r(a,b){return a+(b-a)*this.n();}
  i(a,b){return Math.floor(this.r(a,b+1));} pick(a){return a[Math.floor(this.n()*a.length)];}
  c(p){return this.n()<p;}
}

/* ---------- 贴图：16 格环形缓冲 ---------- */
const SLOTS = 16, PX = 256;              // 每格 256px
const tex = document.createElement('canvas');
tex.width = SLOTS * PX; tex.height = PX;
const tctx = tex.getContext('2d');

const INK = '#141414', PAPER = '#f4f3ef';
const HUES = ['#e8442e','#f5c518','#2fbd6b','#2b6cf6','#ff3ea5','#141414','#7c4dff','#00c2c7'];
const WORDS = ['SOFT MACHINE','PAPER DRIFT','LOOP STUDY','NIGHT INDEX','HALF TONE','KEEP ROLLING',
               'FIELD NOTES','SLOW MOTION','TAPE No.','RE-RUN','GRAIN','OFFSET'];

/* 胶带是白纸，图案是「贴上去的色块」——这是参考里最关键的一点：
   色块小于带宽、带点旋转、之间留白，所以它读起来是纸胶带而不是彩色丝带。 */
function drawPanel(x, seed){
  const r = new Rng(seed), g = tctx;
  g.save(); g.beginPath(); g.rect(x,0,PX,PX); g.clip(); g.translate(x,0);

  g.fillStyle = PAPER; g.fillRect(0,0,PX,PX);          // 纸底

  /* 带子两侧的细边线，让它像一条画出来的纸条 */
  g.strokeStyle = 'rgba(20,20,20,.55)'; g.lineWidth = PX*.012;
  g.beginPath(); g.moveTo(0,PX*.012); g.lineTo(PX,PX*.012);
  g.moveTo(0,PX*.988); g.lineTo(PX,PX*.988); g.stroke();

  /* 贴纸：一格上 0~2 块，多数 1 块 */
  const n = r.c(.14) ? 0 : (r.c(.80) ? 1 : 2);
  for (let k=0;k<n;k++){
    const sz  = PX * r.r(.58, .78);
    const cxp = PX * (n===1 ? r.r(.32,.68) : (k===0 ? r.r(.2,.38) : r.r(.62,.8)));
    const cyp = PX * r.r(.46, .54);
    const rot = r.r(-.16,.16);
    g.save(); g.translate(cxp,cyp); g.rotate(rot); g.translate(-sz/2,-sz/2);

    const hue  = r.pick(HUES);
    const kind = r.i(0,5);
    g.fillStyle = hue; g.fillRect(0,0,sz,sz);

    if (kind === 0){                      // 唱片：黑圆 + 白孔
      g.fillStyle = INK; g.beginPath(); g.arc(sz/2,sz/2,sz*r.r(.26,.33),0,7); g.fill();
      g.fillStyle = PAPER; g.beginPath(); g.arc(sz/2,sz/2,sz*.07,0,7); g.fill();
    } else if (kind === 1){               // 对角三角
      g.fillStyle = r.pick(HUES); g.beginPath();
      g.moveTo(0,sz); g.lineTo(sz,0); g.lineTo(sz,sz); g.closePath(); g.fill();
    } else if (kind === 2){               // 竖条
      g.fillStyle = r.pick(HUES);
      const m = r.i(3,6);
      for(let i=0;i<m;i++) g.fillRect(sz*(.12+i*.76/m), sz*.2, sz*.76/m*.5, sz*.6);
    } else if (kind === 3){               // 同心圈（蓝色系最像参考里那个）
      for(let i=5;i>0;i--){
        g.fillStyle = i%2 ? 'rgba(255,255,255,.55)' : hue;
        g.beginPath(); g.arc(sz/2,sz/2,sz*.44*i/5,0,7); g.fill(); }
    } else if (kind === 4){               // 黑条 + 编号
      g.fillStyle = INK; g.fillRect(0, sz*.30, sz, sz*.40);
      g.fillStyle = PAPER; g.font = `700 ${sz*.2}px ui-monospace,monospace`;
      g.fillText(String(r.i(1,99)).padStart(2,'0'), sz*.08, sz*.58);
    } else {                              // 斜纹
      g.strokeStyle = INK; g.lineWidth = sz*.06;
      for(let i=-sz;i<sz*2;i+=sz*.2){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+sz,sz); g.stroke(); }
    }
    g.restore();
  }

  /* 纸上的小字：贴着带子走，灰黑色，很小 */
  g.save();
  g.fillStyle = 'rgba(20,20,20,.62)';
  g.font = `${PX*.052}px ui-monospace,monospace`;
  if (r.c(.75)) g.fillText(r.pick(WORDS), PX*r.r(.06,.3), PX*r.r(.14,.2));
  if (r.c(.55)) g.fillText('N°' + String(seed%1000).padStart(3,'0') + '  ' + r.pick(WORDS),
                           PX*r.r(.06,.25), PX*r.r(.86,.93));
  g.restore();
  g.restore();
}

const slotSeed = new Array(SLOTS).fill(0);
function fillSlot(slot, idx){                 // idx = 全局第几格，保证每次都是新种子
  const seed = (idx * 2654435761) >>> 0;
  slotSeed[slot] = idx;
  drawPanel(slot * PX, seed);
}
for (let i = 0; i < SLOTS; i++) fillSlot(i, i);

/* ---------- 路径：胶带在空间里怎么走 ---------- */
const WID = 1.45;                              // 带宽
const TABLE = 0;              // 桌面高度：一切都发生在这个平面上
function path(s){
  // 蜿蜒：两个不同频率的正弦叠加
  const x = s;
  const z = 3.5*Math.sin(s*0.34) + 1.9*Math.sin(s*0.155 + 1.3);
  // 离桌面的高度：带子是贴着桌面滑的，只是轻微起伏
  let y = 0.58 + 0.26*Math.sin(s*0.55 + .7) + 0.12*Math.sin(s*0.31);
  // 末段压下去，让带子降到桌面、卷进卷轴（几何固定，跟滚动量无关）
  const u = s / SPAN;
  if (u > 0.80){
    const t = Math.min(1, (u - 0.80)/0.20);
    y *= 1 - t*t*(3-2*t)*0.97;        // smoothstep 收到几乎贴桌
  }
  return [x, TABLE + y, z];
}
function frame(s){
  const h = .05;
  const a = path(s-h), b = path(s+h);
  let tx=b[0]-a[0], ty=b[1]-a[1], tz=b[2]-a[2];
  const tl = Math.hypot(tx,ty,tz); tx/=tl; ty/=tl; tz/=tl;
  // 侧向 = T × up
  let bx = tz*0 - ty*0, by = 0, bz = 0;
  bx = ty*0 - tz*1; by = tz*0 - tx*0; bz = tx*1 - ty*0;   // T × (0,1,0)
  const bl = Math.hypot(bx,by,bz); bx/=bl; by/=bl; bz/=bl;
  // 绕 T 扭一点，带子才有正反面的翻转感
  // 桌面上的纸带只有很轻的侧倾，不做丝带式翻卷
  const a2 = 0;                       // 桌上的纸胶带是平摊的，不翻卷
  const ca = Math.cos(a2), sa = Math.sin(a2);
  // N = T × B
  const nx = ty*bz-tz*by, ny = tz*bx-tx*bz, nz = tx*by-ty*bx;
  return { p: path(s),
           b: [bx*ca+nx*sa, by*ca+ny*sa, bz*ca+nz*sa],
           n: [nx*ca-bx*sa, ny*ca-by*sa, nz*ca-bz*sa] };
}

/* ---------- 相机 ---------- */
const cam = { yaw: -0.26, pitch: 0.66, dist: 17.5, tyaw:-0.26, tpitch:0.66 };
let cx=0, cy=0, F=1;
function project(p, out){
  // 平移到视点中心（跟着 s0 走），再按 yaw/pitch 旋到相机空间
  let x = p[0] - view.cxw, y = p[1], z = p[2];
  const cy1 = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  let x1 =  x*cy1 + z*sy, z1 = -x*sy + z*cy1;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  let y1 =  y*cp - z1*sp, z2 = y*sp + z1*cp;
  z2 += cam.dist;
  // 屏幕 y 向下，世界 y 向上，这里必须取负——否则整个场景上下颠倒，
  // 影子会跑到物体上方
  out[0] = cx + F*x1/z2; out[1] = cy - F*y1/z2; out[2] = z2;
  return z2 > 0.35;
}

/* ---------- 状态 ---------- */
const view = { s0: 0, vel: 0, cxw: 0 };
const SEG = 1.5;                 // 一格 ≈ 带宽，贴纸在世界里才是方的
const SPAN = 22;                 // 桌上这条带子有多长（固定）
const STEP = 0.19;               // 采样步长

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const shCv = document.createElement('canvas'), shCtx = shCv.getContext('2d');   // 影子离屏层
const blCv = document.createElement('canvas'), blCtx = blCv.getContext('2d');   // 糊完的影子
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  shCv.width = blCv.width = Math.round(W/3);
  shCv.height = blCv.height = Math.round(H/3);   // 1/3 分辨率就够，反正要糊
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W/2; cy = H*0.52; F = Math.min(W,H)*1.15;
}
addEventListener('resize', resize); resize();

/* ---------- 交互 ---------- */
let dragging=false, lastX=0, lastY=0, orbit=false, mx=0, my=0;
cv.addEventListener('pointerdown', e=>{ dragging=true; cv.classList.add('drag');
  lastX=e.clientX; lastY=e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', e=>{ dragging=false; cv.classList.remove('drag'); });
cv.addEventListener('pointermove', e=>{
  mx = (e.clientX/W-.5); my = (e.clientY/H-.5);
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  if (orbit){ cam.tyaw += dx*0.005; cam.tpitch = Math.max(.12, Math.min(1.35, cam.tpitch + dy*0.004)); }
  else { view.vel += (dx - dy)* -0.0016 * 1.2; }
});
addEventListener('wheel', e=>{ view.vel += e.deltaY*0.0010; }, {passive:true});
addEventListener('keydown', e=>{
  if(e.code==='Tab'){ e.preventDefault(); orbit=!orbit; document.getElementById('orb').textContent = orbit?'ON':'OFF'; }
  if(e.code==='Space'){ e.preventDefault(); view.vel = -0.55; }
});

/* ---------- 渲染 ---------- */
const A=[0,0,0], B=[0,0,0], C=[0,0,0], D=[0,0,0];
let head = SLOTS-1;                       // 已经生成到第几格
let frames=0, fpsT=performance.now();

function segs(){
  const out = [];
  const s0 = 0;                       // 几何固定：带子的形状和位置永远不变
  const n = Math.floor(SPAN/STEP);
  let prev = null;
  for(let i=0;i<=n;i++){
    const s = s0 + i*STEP;
    const f = frame(s);
    const l = [f.p[0]-f.b[0]*WID/2, f.p[1]-f.b[1]*WID/2, f.p[2]-f.b[2]*WID/2];
    const r = [f.p[0]+f.b[0]*WID/2, f.p[1]+f.b[1]*WID/2, f.p[2]+f.b[2]*WID/2];
    const cur = { l, r, s, n: f.n, p: f.p };
    if (prev) out.push([prev, cur]);
    prev = cur;
  }
  return out;
}

/* 一段 = 一个四边形，用仿射把贴图里对应的竖条拉过去 */
function quad(p0,p1,p2,p3, u0,u1, shade){
  // p0=左近 p1=右近 p2=右远 p3=左远
  const su0 = u0*tex.width, su1 = u1*tex.width;
  const du = su1-su0; if (Math.abs(du) < 1e-6) return;
  const ex = (p3[0]-p0[0])/du,  ey = (p3[1]-p0[1])/du;        // u 方向
  const fx = (p1[0]-p0[0])/PX,  fy = (p1[1]-p0[1])/PX;        // v 方向
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]);
  ctx.lineTo(p2[0],p2[1]); ctx.lineTo(p3[0],p3[1]); ctx.closePath();
  ctx.clip();
  ctx.transform(ex, ey, fx, fy, p0[0]-ex*su0, p0[1]-ey*su0);
  ctx.drawImage(tex, 0, 0);
  // 贴图不会自己重复：跨过右/左边界时补一张，否则越界那截是空白
  // （卷轴绕一圈的 u 跨度大，最容易踩到）
  if (su1 > tex.width || su0 > tex.width) ctx.drawImage(tex, tex.width, 0);
  if (su0 < 0 || su1 < 0) ctx.drawImage(tex, -tex.width, 0);
  ctx.restore();
  if (shade > 0.001){                                          // 受光：压暗
    ctx.save(); ctx.beginPath();
    ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]);
    ctx.lineTo(p2[0],p2[1]); ctx.lineTo(p3[0],p3[1]); ctx.closePath();
    ctx.fillStyle = `rgba(20,20,26,${shade})`; ctx.fill(); ctx.restore();
  }
}

/* 末端那卷胶带：用同一套四边形管线，把带子绕成一个圆 */
const ROLL_R = 2.15, ROLL_K = 34;
function rollFaces(sEnd, out){
  const f = frame(sEnd), h = .05;
  const a = path(sEnd-h), b2 = path(sEnd+h);
  let tx=b2[0]-a[0], ty=0, tz=b2[2]-a[2];        // 切线也拍平到桌面
  const tl = Math.hypot(tx,tz) || 1; tx/=tl; tz/=tl;
  // 卷轴是立在桌面上的实物：轴保持水平，圆心离桌面正好一个半径，
  // 所以它永远稳稳地坐在桌上，不跟着带子翻滚。
  let axx = f.b[0], axz = f.b[2];
  const al = Math.hypot(axx, axz) || 1;
  const ax = [axx/al, 0, axz/al];                // 轴：水平，垂直于带子走向
  const n = [0, 1, 0];                           // 法线 = 桌面朝上
  const C = [f.p[0], TABLE + ROLL_R, f.p[2]];
  const ring = th => {
    const c = Math.cos(th), si = Math.sin(th);
    return [ C[0] - (tx*c + n[0]*si)*ROLL_R,
             C[1] - (ty*c + n[1]*si)*ROLL_R,
             C[2] - (tz*c + n[2]*si)*ROLL_R ];
  };
  const P=[0,0,0],Q=[0,0,0],R2=[0,0,0],S2=[0,0,0];
  const uHead = ((((sEnd+view.s0)/SEG)%SLOTS)+SLOTS)%SLOTS/SLOTS;
  const spin = view.s0 / ROLL_R;        // 抽出多少带子，卷轴就转多少
  for(let k=0;k<ROLL_K;k++){
    const t0 = k/ROLL_K*Math.PI*2 + spin, t1 = (k+1)/ROLL_K*Math.PI*2 + spin;
    const c0 = ring(t0), c1 = ring(t1);
    const l0=[c0[0]-ax[0]*WID/2, c0[1]-ax[1]*WID/2, c0[2]-ax[2]*WID/2];
    const r0=[c0[0]+ax[0]*WID/2, c0[1]+ax[1]*WID/2, c0[2]+ax[2]*WID/2];
    const l1=[c1[0]-ax[0]*WID/2, c1[1]-ax[1]*WID/2, c1[2]-ax[2]*WID/2];
    const r1=[c1[0]+ax[0]*WID/2, c1[1]+ax[1]*WID/2, c1[2]+ax[2]*WID/2];
    if(!(project(l0,P)&&project(r0,Q)&&project(r1,R2)&&project(l1,S2))) continue;
    // 卷起来的部分背光更多，压暗一点做出圆柱感
    const sh = 0.05 + 0.22*(0.5 - 0.5*Math.cos(t0 + 1.1));
    out.push({ depth:(P[2]+Q[2]+R2[2]+S2[2])/4, shade: sh,
      q:[[P[0],P[1]],[Q[0],Q[1]],[R2[0],R2[1]],[S2[0],S2[1]]],
      u0: uHead + k/ROLL_K*0.5, u1: uHead + (k+1)/ROLL_K*0.5 });
  }
  // 两侧端面：浅灰实心圆
  for (const side of [-1, 1]){
    const pts = [];
    let dep = 0, ok = true;
    for(let k=0;k<ROLL_K;k++){
      const c = ring(k/ROLL_K*Math.PI*2);
      const v = [c[0]+ax[0]*side*WID/2, c[1]+ax[1]*side*WID/2, c[2]+ax[2]*side*WID/2];
      if(!project(v,P)){ ok=false; break; }
      pts.push([P[0],P[1]]); dep += P[2];
    }
    if(!ok) continue;
    out.push({ depth: dep/ROLL_K, flat:'#e4e3df', poly: pts });
    // 内圈纸芯 + 中心孔：一卷胶带的识别特征全在这儿
    for (const [rr, col, dz] of [[0.52,'#d3d2cd',-0.02], [0.30,'#9b9a95',-0.04]]){
      const ip = []; let ok2 = true;
      for(let k=0;k<ROLL_K;k++){
        const th = k/ROLL_K*Math.PI*2;
        const c = ring(th);
        const v = [C[0] + (c[0]-C[0])*rr + ax[0]*side*WID/2,
                   C[1] + (c[1]-C[1])*rr,
                   C[2] + (c[2]-C[2])*rr + ax[2]*side*WID/2];
        if(!project(v,P)){ ok2=false; break; }
        ip.push([P[0],P[1]]);
      }
      if(ok2) out.push({ depth: dep/ROLL_K + dz, flat: col, poly: ip });
    }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // 背景：很淡的渐变地面
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fbfbf9'); g.addColorStop(1,'#e6e6e1');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 桌面上的一片光：没有它，白底就只是"空"，不是"桌"
  const pool = ctx.createRadialGradient(W*0.5, H*0.62, 0, W*0.5, H*0.62, Math.max(W,H)*0.62);
  pool.addColorStop(0,'rgba(255,255,255,.85)'); pool.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = pool; ctx.fillRect(0,0,W,H);

  view.cxw = SPAN*0.52;                   // 相机钉死：桌子不动，只有带子在动
  cam.yaw   += (cam.tyaw   + mx*0.12 - cam.yaw)   * 0.08;
  cam.pitch += (cam.tpitch + my*0.06 - cam.pitch) * 0.08;

  const list = segs();

  /* 影子：先画到离屏半分辨率层，再整体糊一次贴回来——
     逐段模糊太贵，整体糊一次只花一个 drawImage */
  const GY = TABLE + 0.005;      // 影子落在桌面上
  shCtx.setTransform(1,0,0,1,0,0);
  shCtx.clearRect(0,0,shCv.width,shCv.height);
  shCtx.scale(1/3, 1/3);
  shCtx.fillStyle = '#1e1e24';
  for (let si = 0; si < list.length; si += 2){        // 影子反正要糊，隔段取样就够
    const a = list[si][0], b = list[Math.min(si+2, list.length-1)][1];
    // 沿光线方向投影：影子该偏在物体一侧，不是正下方
    const LX = 0.62, LZ = 0.30;
    const sp = v => [v[0] + (v[1]-TABLE)*LX, GY, v[2] + (v[1]-TABLE)*LZ];
    const fl=sp(a.l), fr=sp(a.r), nl=sp(b.l), nr=sp(b.r);
    if(!(project(fl,A)&&project(fr,B)&&project(nr,C)&&project(nl,D))) continue;
    shCtx.beginPath(); shCtx.moveTo(A[0],A[1]); shCtx.lineTo(B[0],B[1]);
    shCtx.lineTo(C[0],C[1]); shCtx.lineTo(D[0],D[1]); shCtx.closePath(); shCtx.fill();
  }
  // 注意：ctx.filter 的模糊是按「目标尺寸」算的，所以必须在小画布上糊完再放大，
  // 直接 filter+drawImage 放大会按全屏像素做模糊，白白贵 9 倍。
  blCtx.setTransform(1,0,0,1,0,0);
  blCtx.clearRect(0,0,blCv.width,blCv.height);
  blCtx.filter = 'blur(1.6px)';
  blCtx.drawImage(shCv, 0, 0);
  // 卷轴的接地影：一个压在桌面上的椭圆。没有它，卷轴就是"飘着"的
  {
    const f = frame(SPAN);
    const cxw = f.p[0], czw = f.p[2];
    const P2=[0,0,0]; const pts=[];
    let ok = true;
    for(let k=0;k<20;k++){
      const th = k/20*Math.PI*2;
      // 卷轴又高又圆，影子被拉成一条斜着的长椭圆
      const v = [cxw + Math.cos(th)*ROLL_R*0.95 + ROLL_R*0.62,
                 TABLE+0.004,
                 czw + Math.sin(th)*ROLL_R*0.52 + ROLL_R*0.30];
      if(!project(v,P2)){ ok=false; break; }
      pts.push([P2[0],P2[1]]);
    }
    if(ok){
      shCtx.beginPath();
      pts.forEach((pt,i)=> i ? shCtx.lineTo(pt[0],pt[1]) : shCtx.moveTo(pt[0],pt[1]));
      shCtx.closePath(); shCtx.fill();
    }
  }
  blCtx.setTransform(1,0,0,1,0,0);
  blCtx.clearRect(0,0,blCv.width,blCv.height);
  blCtx.filter = 'blur(1.6px)';
  blCtx.drawImage(shCv, 0, 0);
  ctx.save();
  ctx.globalAlpha = .26;
  ctx.drawImage(blCv, 0, 0, W, H);
  ctx.restore();

  /* 带子：按深度远→近画（画家算法），自遮挡才对 */
  const drawn = [];
  for (const [a,b] of list){
    if(!(project(a.l,A)&&project(a.r,B)&&project(b.r,C)&&project(b.l,D))) continue;
    const depth = (A[2]+B[2]+C[2]+D[2])/4;
    // 受光：法线与光向的夹角
    // 纸带两面都会被照到，取绝对值；最多压 0.26，再多就发闷
    const nd  = a.n[0]*0.35 + a.n[1]*0.86 + a.n[2]*0.38;
    const lam = Math.abs(nd);
    const shade = 0.26 * (1 - Math.min(1, lam));
    drawn.push({ depth, shade,
      q:[[A[0],A[1]],[B[0],B[1]],[C[0],C[1]],[D[0],D[1]]],
      // 滚动的是内容不是几何：u 加上 view.s0，带子就像从卷轴里抽出来
      u0:(((a.s+view.s0)/SEG)%SLOTS+SLOTS)%SLOTS/SLOTS,
      u1:(((b.s+view.s0)/SEG)%SLOTS+SLOTS)%SLOTS/SLOTS });
  }
  rollFaces(SPAN, drawn);                 // 卷轴钉在桌上的固定位置
  drawn.sort((p,q)=>q.depth-p.depth);
  for(const d of drawn){
    if (d.poly){                           // 卷轴端面
      ctx.beginPath();
      d.poly.forEach((pt,i)=> i ? ctx.lineTo(pt[0],pt[1]) : ctx.moveTo(pt[0],pt[1]));
      ctx.closePath(); ctx.fillStyle = d.flat; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 1; ctx.stroke();
      continue;
    }
    let {u0,u1} = d;
    if (u1 < u0) u1 += 1;                 // 跨过贴图接缝
    quad(d.q[0],d.q[1],d.q[2],d.q[3], u0, u1, d.shade);
  }
}

/* ---------- 主循环 ---------- */
function tick(now){
  view.vel *= 0.94;                        // 惯性
  if (!dragging && Math.abs(view.vel) < 0.0006) view.vel = 0.0065;  // 静止时自己慢慢滚
  view.s0 += view.vel * 60/60;


  /* 关键：滚过一格就重画那一格 → 图案永远是新的 */
  const need = Math.floor((view.s0 + SPAN)/SEG) + 2;
  while (head < need){ head++; fillSlot(((head % SLOTS)+SLOTS)%SLOTS, head); }
  if (view.s0 < 0) view.s0 = 0;

  draw();

  frames++;
  if (now - fpsT > 500){
    document.getElementById('fps').textContent = Math.round(frames*1000/(now-fpsT));
    frames = 0; fpsT = now;
  }
  const idx = Math.floor(view.s0/SEG);
  document.getElementById('cnt').textContent = String(idx).padStart(3,'0');
  document.getElementById('fill').style.width = ((view.s0/SEG)%SLOTS)/SLOTS*100 + '%';
  const w = WORDS[idx % WORDS.length];
  document.getElementById('now').textContent = '#' + String(idx%100).padStart(2,'0') + '  ' + w;
  document.getElementById('cardT').innerHTML = w.replace(' ','<br>') + '<small>OBJECT / 2026</small>';
  document.getElementById('cardSw').style.background = HUES[idx % HUES.length];
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
